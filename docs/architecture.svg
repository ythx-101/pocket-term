<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system, system-ui, Segoe UI, sans-serif">
  <defs>
    <style>
      /* Dark theme (default) */
      text { font-size: 13px; fill: #575279; }
      .title { font-size: 16px; font-weight: 700; fill: #575279; }
      .subtitle { font-size: 11px; fill: #797593; }
      .label { font-size: 12px; font-weight: 600; fill: #575279; }
      .small { font-size: 10px; fill: #797593; }
      .box { fill: #faf4ed; stroke: #cecacd; stroke-width: 1.5; rx: 6; }
      .accent { fill: #fffaf3; stroke: #ea9d34; stroke-width: 1.5; rx: 6; }
      .green { fill: #f2f9f9; stroke: #286983; stroke-width: 1.5; rx: 6; }
      .line { stroke: #cecacd; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      rect.bg { fill: #faf4ed; }
      @media (prefers-color-scheme: dark) {
        text { fill: #e0def4; }
        .title { fill: #e0def4; }
        .subtitle { fill: #908caa; }
        .label { fill: #e0def4; }
        .small { fill: #6e6a86; }
        .box { fill: #1f1d2e; stroke: #403d52; }
        .accent { fill: #26233a; stroke: #f6c177; }
        .green { fill: #26233a; stroke: #31748f; }
        .line { stroke: #403d52; }
        rect.bg { fill: #191724; }
      }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#797593"/>
    </marker>
    <marker id="arrow-bidi" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#797593"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" class="bg" rx="8"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" class="title">pocket-term Architecture</text>
  <text x="400" y="50" text-anchor="middle" class="subtitle">Three tiers — one repo. Terminal in browser, securely.</text>

  <!-- ── Left column: Client ── -->
  <rect x="30" y="72" width="160" height="120" class="box"/>
  <text x="110" y="98" text-anchor="middle" class="label">Client</text>
  <text x="110" y="118" text-anchor="middle" class="small">Desktop / Laptop</text>
  <text x="110" y="138" text-anchor="middle" class="small">Phone / Tablet</text>
  <text x="110" y="158" text-anchor="middle" class="small">xterm.js + WebSocket</text>
  <text x="110" y="178" text-anchor="middle" class="small">Mobile UI (L1): touch scroll,</text>
  <text x="110" y="192" text-anchor="middle" class="small">CJK IME, shortcuts, upload</text>

  <!-- ── Center column: Tunnel Layer ── -->
  <rect x="240" y="72" width="160" height="170" class="box"/>
  <text x="320" y="98" text-anchor="middle" class="label">Tunnel Layer</text>
  <text x="320" y="118" text-anchor="middle" class="small">Transport + TLS ONLY</text>
  <text x="320" y="138" text-anchor="middle" class="small">Not authentication!</text>

  <rect x="258" y="152" width="124" height="38" class="green"/>
  <text x="320" y="168" text-anchor="middle" class="small">L0: Quick Tunnel</text>
  <text x="320" y="182" text-anchor="middle" class="small">*.trycloudflare.com</text>

  <rect x="258" y="198" width="124" height="38" class="accent"/>
  <text x="320" y="214" text-anchor="middle" class="small">L1: Tailscale Serve</text>
  <text x="320" y="228" text-anchor="middle" class="small">/ Funnel (stable URL)</text>

  <!-- ── Right column: Server ── -->
  <rect x="450" y="72" width="320" height="240" class="box"/>
  <text x="610" y="98" text-anchor="middle" class="label">Server (127.0.0.1 only)</text>

  <rect x="468" y="112" width="284" height="52" class="accent"/>
  <text x="610" y="130" text-anchor="middle" class="label">ttyd 1.6.3</text>
  <text x="610" y="148" text-anchor="middle" class="small">-c user:password (Basic Auth)</text>
  <text x="610" y="162" text-anchor="middle" class="small">WebSocket terminal + enhanced HTML</text>

  <rect x="468" y="176" width="132" height="40" class="box"/>
  <text x="534" y="200" text-anchor="middle" class="label">$SHELL</text>
  <text x="534" y="214" text-anchor="middle" class="small">Your terminal</text>

  <rect x="616" y="176" width="136" height="40" class="green"/>
  <text x="684" y="196" text-anchor="middle" class="label">/up Upload</text>
  <text x="684" y="212" text-anchor="middle" class="small">Basic auth</text>

  <rect x="468" y="228" width="284" height="76" rx="4" fill="#fff0f3" stroke="#b4637a" stroke-width="1"/>
  <text x="610" y="248" text-anchor="middle" class="small" fill="#b4637a">Security boundary</text>
  <text x="610" y="264" text-anchor="middle" class="small">ttyd bind: 127.0.0.1 only</text>
  <text x="610" y="278" text-anchor="middle" class="small">Auth: ttyd -c (all tiers)</text>
  <text x="610" y="292" text-anchor="middle" class="small">Non-root user enforced</text>

  <!-- ── L2 Advanced ── -->
  <rect x="240" y="280" width="160" height="130" class="box" stroke-dasharray="4,2"/>
  <text x="320" y="304" text-anchor="middle" class="label">L2: Advanced</text>
  <text x="320" y="324" text-anchor="middle" fill="#9893a5" class="small">Documentation only</text>
  <text x="320" y="344" text-anchor="middle" class="small">Own domain + TLS cert</text>
  <text x="320" y="362" text-anchor="middle" class="small">Cloudflare Access (email)</text>
  <text x="320" y="380" text-anchor="middle" class="small">Named tunnel + nginx</text>
  <text x="320" y="398" text-anchor="middle" class="small">herdr multi-agent</text>

  <rect x="450" y="340" width="320" height="80" class="box"/>
  <text x="610" y="364" text-anchor="middle" class="label">Route / Reverse Proxy (L2)</text>
  <text x="610" y="384" text-anchor="middle" class="small">nginx → 127.0.0.1:7681 (ttyd)</text>
  <text x="610" y="400" text-anchor="middle" class="small">nginx → 127.0.0.1:7698 (/up)</text>

  <!-- ── Arrows ── -->
  <line x1="190" y1="132" x2="240" y2="132" class="line"/>
  <line x1="400" y1="132" x2="468" y2="132" class="line"/>
  <path d="M468,175 L468,140 L534,140 L534,176" class="line" marker-end="url(#arrow)"/>
  <line x1="610" y1="164" x2="610" y2="176" class="line"/>
  <line x1="450" y1="370" x2="420" y2="370" class="line"/>

  <!-- ── Footer ── -->
  <text x="400" y="470" text-anchor="middle" class="title">MIT License · github.com/ythx-101/pocket-term</text>
  <text x="400" y="490" text-anchor="middle" class="subtitle">Built on ttyd · xterm.js · cloudflared · Tailscale · libwebsockets · Python · herdr</text>
</svg>
